{% extends "base.html" %}
{% load static %}
{% block page_content %}
<div class="wrapper max-w-[540px] pt-12 mb-8">
  <div class="mb-8 text-center">
    <h1 class="text-[24px] font-medium text-[#000480]">パスワード再設定</h1>
  </div>

  <div class="rounded-[24px] border border-[#D9E2F2] bg-white px-6 py-7 shadow-[0_6px_18px_rgba(0,0,0,0.1)] md:px-8 md:py-8">
    <form>
      <div class="mb-8 text-[16px] leading-[1.45] text-[#111111]">
        <p>アプリに登録されているメールアドレスを入力してください。</p>
        <p class="mt-5">登録されているメールアドレスに、パスワード再設定用のURLを送信します。</p>
      </div>

      <div class="mb-6">
        <label for="id_email" class="mb-2 block text-[15px] font-medium text-[#333333]">
          メールアドレス
        </label>
        <input type="email" id="id_email" name="email" placeholder="example@email.com"
          class="w-full rounded-[14px] border border-[#D9D9D9] bg-[#F5F5F5] px-4 py-3 text-[15px] text-[#333333] placeholder:text-[#9A9A9A] outline-none transition focus:border-[#1565E5] focus:bg-white" />
      </div>

      <button type="button"
        class="flex w-full items-center justify-center rounded-[14px] bg-[#1565E5] px-5 py-3 text-[16px] font-bold text-white transition hover:opacity-90">
        送信
      </button>
    </form>
  </div>

  <div class="mt-10 text-center">
    <a href="{% url 'home' %}" class="inline-flex items-center gap-2 text-[16px] font-medium text-[#1565E5] hover:underline">
      <span aria-hidden="true" class="text-[28px] leading-none">←</span>
      <span>ホームに戻る</span>
    </a>
  </div>
</div>
{% endblock %}
