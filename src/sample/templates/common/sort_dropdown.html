{% load static %}

<div class="flex items-center gap-2 text-sm text-customGray">
  <span>並び替え：</span>

  <!-- カスタムドロップダウン本体 -->
  <div class="relative" id="sortDropdown">
    <!-- 表示ボタン -->
    <button type="button" id="sortButton" class="flex items-center justify-between gap-4 min-w-[220px]
             border border-[#d1d1d1] rounded-lg px-4 py-3 bg-white
             shadow-sm hover:bg-slate-50 transition" aria-haspopup="listbox" aria-expanded="false">
      <!-- 左：選択中 -->
      <span class="inline-flex items-center gap-2" id="sortButtonLabel">
        <img id="sortButtonIcon" src="{% static 'img/like_arrow.svg' %}" alt="" class="w-5 h-5" />
        <span id="sortButtonText">いいね順</span>
      </span>

      <!-- 右：下向き矢印 -->
      <img src="{% static 'img/down_arrow.svg' %}" alt="open" class="w-4 h-4" />
    </button>

    <!-- 開いた時のリスト -->
    <div id="sortMenu" class="absolute right-0 mt-2 w-full bg-white border border-[#d1d1d1]
            rounded-xl shadow-lg overflow-hidden hidden z-50" role="listbox">
      <!-- いいね順 -->
      <button type="button" class="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition"
        data-value="likes" data-label="いいね順" data-icon="{% static 'img/like_arrow.svg' %}">
        <span class="inline-flex items-center gap-2">
          <img src="{% static 'img/like_arrow.svg' %}" alt="" class="w-5 h-5" />
          <span>いいね順</span>
        </span>
        <img src="{% static 'img/gray_check.svg' %}" alt="selected" class="w-5 h-5 js-check hidden" />
      </button>

      <!-- 投稿日順 -->
      <button type="button" class="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition"
        data-value="date" data-label="投稿日順" data-icon="{% static 'img/gray_clock.svg' %}">
        <span class="inline-flex items-center gap-2">
          <img src="{% static 'img/gray_clock.svg' %}" alt="" class="w-5 h-5" />
          <span>投稿日順</span>
        </span>
        <img src="{% static 'img/gray_check.svg' %}" alt="selected" class="w-5 h-5 js-check hidden" />
      </button>

      <!-- 評価順 -->
      <button type="button" class="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition"
        data-value="rating" data-label="評価順" data-icon="{% static 'img/gray_star.svg' %}">
        <span class="inline-flex items-center gap-2">
          <img src="{% static 'img/gray_star.svg' %}" alt="" class="w-5 h-5" />
          <span>評価順</span>
        </span>
        <img src="{% static 'img/gray_check.svg' %}" alt="selected" class="w-5 h-5 js-check hidden" />
      </button>
    </div>
  </div>
</div>

<!-- 選択状態保持（pulldown.js がここを見る） -->
<input type="hidden" id="sortValue" value="likes" />
