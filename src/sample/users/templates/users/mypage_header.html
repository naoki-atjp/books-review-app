{% load static %}

<div class="rounded-3xl border-[3px] border-[#DAE7FF] bg-white shadow-sm">
  <div class="p-10">

    <div class="flex items-start gap-10">

      <!-- 左：アイコンだけ -->
      <div class="shrink-0">
        <div class="w-28 h-28 rounded-full bg-gray-100 flex items-center justify-center">
          <img src="{{ user_data.icon_url }}" alt="ユーザーアイコン" class="w-full h-full object-cover" />
        </div>
      </div>

      <!-- 右：情報エリア（ここが main） -->
      <div class="flex-1">
        <div class="flex items-start justify-between gap-4">

          <!-- 名前 + メール/登録日 -->
          <div>
            <h2 class="text-xl text-customGray">
              {{ user_data.name }}
            </h2>

            <div class="mt-4 space-y-3 text-customGray">
              <!-- メール -->
              <div class="flex items-center gap-2">
                <img src="{% static 'img/email.svg' %}" alt="メール" class="w-4 h-4" />
                <span class="text-sm">{{ user_data.email }}</span>
              </div>

              <!-- 登録日 -->
              <div class="flex items-center gap-2">
                <img src="{% static 'img/calendar.svg' %}" alt="登録日" class="w-4 h-4" />
                <span class="text-sm">登録日: {{ user_data.registered_date }}</span>
              </div>
            </div>
          </div>

          <!-- 編集ボタン -->
          <div>
            <a href="{% url 'users:mypage' %}?mode=edit" class="
            inline-flex items-center gap-1
            px-4 py-2 rounded-2xl
            border border-gray-300
            text-customGray
            bg-white
            transition-all duration-200 ease-out
            hover:bg-[#DAE7FF]
            hover:border-[#2F6FED]
            hover:text-[#000480]
            hover:shadow-sm
            hover:-translate-y-[1px]
            active:translate-y-0
            active:shadow-none
            focus-visible:outline-none
            focus-visible:ring-2 focus-visible:ring-[#2F6FED]/40
            focus-visible:ring-offset-2
          ">
              <img src="{% static 'img/gray_pencil.svg' %}" alt="編集" class="w-4 h-4" />
              <span class="text-base font-medium">編集</span>
            </a>
          </div>

        </div>
        <div class="mt-6 border-t border-gray-200"></div>
        
        {% include "users/user_stats.html" with stats=user_data.stats %}

      </div>
    </div>

  </div>
</div>
