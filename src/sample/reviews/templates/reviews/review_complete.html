{% extends "base.html" %}
{% load static %}

{% block title %}投稿完了{% endblock %}

{% block page_content %}
<div class="fixed inset-0 z-50">
  <div class="absolute inset-0 bg-black/40"></div>

  <div class="relative min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-[640px] bg-white rounded-2xl shadow-lg border border-[#d1d1d1] px-8 py-10">

      <h1 class="text-center text-2xl font-bold mb-8" style="color:#000480;">
        レビューの投稿が完了しました！
      </h1>

      <div class="flex justify-center mb-8">
        <img src="{% static 'img/complete.svg' %}" alt="投稿完了" class="w-20 h-20" />
      </div>

      <div class="flex flex-col gap-3 items-center">
        <a href="#" class="
            w-full max-w-[360px]
            inline-flex justify-center items-center
            px-4 py-3 rounded-lg
            bg-customBlue text-white
            text-sm font-medium
            hover:opacity-90 transition
          ">
          投稿を表示する
        </a>

        <a href="{% url 'home' %}" class="
            w-full max-w-[360px]
            inline-flex justify-center items-center
            px-4 py-3 rounded-lg
            text-sm font-medium
            text-customGray
            border border-[#a5a5a5]
            hover:bg-slate-50
            transition
          ">
          ホームに戻る
        </a>

      </div>
    </div>
  </div>
</div>
{% endblock %}
